services:
  iris:
    image: ${REGISTRY_PREFIX}iris:${STACK_NAME:-latest}
    build: ./app
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    ports:
      - "8000:8000"
      - "2525:2525"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
    environment:
      - AWS_REGION
      - EMAIL_SENDER
      - ENV
      - TZ=Pacific/Auckland
      - DISCORD_ALERTS_WEBHOOK_URL=${DISCORD_ALERTS_WEBHOOK_URL}
      - DISCORD_USER_ID=${DISCORD_USER_ID}
    networks:
      - aether-net
    secrets:
      - source: iris_aws_access_key_id
        target: AWS_ACCESS_KEY_ID
      - source: iris_aws_secret_access_key
        target: AWS_SECRET_ACCESS_KEY

secrets:
  iris_aws_access_key_id:
    external: true
    name: ${IRIS_AWS_ACCESS_KEY_ID_NAME}
  iris_aws_secret_access_key:
    external: true
    name: ${IRIS_AWS_SECRET_ACCESS_KEY_NAME}

networks:
  aether-net:
    external: true
