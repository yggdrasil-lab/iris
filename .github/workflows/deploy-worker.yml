name: Deploy Iris Email Worker

on:
  push:
    branches: ["main"]
    paths:
      - "email-worker/**"
      - ".github/workflows/deploy-worker.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "email-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "email-worker/package-lock.json"

      - name: Install dependencies
        working-directory: email-worker
        run: npm ci

      - name: Typecheck
        working-directory: email-worker
        run: npm run typecheck

      - name: Unit tests
        working-directory: email-worker
        run: npm test

      - name: Dry-run bundle verification
        working-directory: email-worker
        run: >-
          npx wrangler deploy --dry-run
          --outdir /tmp/iris-email-worker-dryrun
          --var "IRIS_WEBHOOK_URL:https://iris.example.com/webhook/email"
          --var "ALLOWED_FORWARDERS:sender@example.com"
          --var "FORWARD_VERIFICATION_TO:inbox@example.com"

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: iris-email-worker-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Required Configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IRIS_WEBHOOK_SECRET: ${{ secrets.IRIS_WEBHOOK_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          IRIS_ALLOWED_FORWARDERS: ${{ vars.IRIS_ALLOWED_FORWARDERS }}
          IRIS_FORWARD_VERIFICATION_TO: ${{ vars.IRIS_FORWARD_VERIFICATION_TO }}
        run: |
          MISSING=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && MISSING="$MISSING CLOUDFLARE_API_TOKEN"
          [ -z "$IRIS_WEBHOOK_SECRET" ] && MISSING="$MISSING IRIS_WEBHOOK_SECRET"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID"
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$IRIS_ALLOWED_FORWARDERS" ] && MISSING="$MISSING IRIS_ALLOWED_FORWARDERS"
          [ -z "$IRIS_FORWARD_VERIFICATION_TO" ] && MISSING="$MISSING IRIS_FORWARD_VERIFICATION_TO"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "email-worker/package-lock.json"

      - name: Install dependencies
        working-directory: email-worker
        run: npm ci

      - name: Deploy Worker
        working-directory: email-worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IRIS_WEBHOOK_SECRET: ${{ secrets.IRIS_WEBHOOK_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          IRIS_ALLOWED_FORWARDERS: ${{ vars.IRIS_ALLOWED_FORWARDERS }}
          IRIS_FORWARD_VERIFICATION_TO: ${{ vars.IRIS_FORWARD_VERIFICATION_TO }}
        run: |
          export SECRETS_FILE="$RUNNER_TEMP/iris-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node -e 'const fs = require("fs"); fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ IRIS_WEBHOOK_SECRET: process.env.IRIS_WEBHOOK_SECRET }), { mode: 0o600 });'
          npx wrangler deploy \
            --var "IRIS_WEBHOOK_URL:https://iris.${DOMAIN_NAME}/webhook/email" \
            --var "ALLOWED_FORWARDERS:${IRIS_ALLOWED_FORWARDERS}" \
            --var "FORWARD_VERIFICATION_TO:${IRIS_FORWARD_VERIFICATION_TO}" \
            --secrets-file "$SECRETS_FILE"
