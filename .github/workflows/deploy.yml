name: Deploy Iris

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Setup Secrets
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          echo "IRIS_AWS_ACCESS_KEY_ID_NAME=$(echo "$AWS_KEY" | /tmp/ensure_secret.sh iris_aws_access_key_id)" >> $GITHUB_ENV
          echo "IRIS_AWS_SECRET_ACCESS_KEY_NAME=$(echo "$AWS_SECRET" | /tmp/ensure_secret.sh iris_aws_secret_access_key)" >> $GITHUB_ENV

      - name: Build and Deploy with Docker Compose
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EMAIL_SENDER: ${{ vars.EMAIL_SENDER }}
          ENV: ${{ vars.ENV }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "iris" docker-compose.yml